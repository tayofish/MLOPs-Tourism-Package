
name: Tourism Project MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:


# =========================================================
# STAGE 1 — REGISTER DATASET
# =========================================================

jobs:

  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7


      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Upload Dataset to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_ML }}
          HF_TOKEN_ML: ${{ secrets.HF_TOKEN_ML }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}

        run: |
          python - <<'PY'
          import os
          from src.hf_utils import upload_to_hf

          upload_to_hf(
              local_path="data/tourism.csv",
              repo_id=os.environ["HF_DATASET_REPO"],
              repo_type="dataset",
              token=os.environ["HF_TOKEN_ML"]
          )
          PY


# =========================================================
# STAGE 2 — MODEL DEVELOPMENT
# =========================================================

  model-training:
    name: Model Training
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7


      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Start MLflow Server
        run: |
          nohup mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            > mlflow.log 2>&1 &
          sleep 5


      - name: Run Model Training Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_ML }}
          HF_TOKEN_ML: ${{ secrets.HF_TOKEN_ML }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          HF_MODEL_REPO: ${{ secrets.HF_MODEL_REPO }}
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000

        run: |
          python -m src.train_model


      - name: Verify Deployment Metadata
        run: |
          echo "Selected model:"
          cat deployment/model_output.txt

          echo ""
          echo "Model repository:"
          cat deployment/model_repo.txt


      # Pass generated metadata to deployment jobs
      - name: Upload Deployment Metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata
          path: |
            deployment/model_output.txt
            deployment/model_repo.txt


# =========================================================
# STAGE 3A — DEPLOY API SPACE
# =========================================================

  deploy-api:
    name: Deploy HF Prediction API
    needs: model-training
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7


      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"


      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub


      - name: Download Deployment Metadata
        uses: actions/download-artifact@v4
        with:
          name: deployment-metadata
          path: deployment


      # API needs these files to locate the selected model
      - name: Prepare API Deployment
        run: |
          cp deployment/model_output.txt \
             deployment/hf_api/model_output.txt

          cp deployment/model_repo.txt \
             deployment/hf_api/model_repo.txt

          echo "API deployment files:"
          ls -la deployment/hf_api


      - name: Deploy API to Hugging Face Space
        env:
          HF_TOKEN_ML: ${{ secrets.HF_TOKEN_ML }}
          HF_API_SPACE_REPO: ${{ secrets.HF_API_SPACE_REPO }}

        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(
              token=os.environ["HF_TOKEN_ML"]
          )

          api.upload_folder(
              folder_path="deployment/hf_api",
              repo_id=os.environ["HF_API_SPACE_REPO"],
              repo_type="space"
          )

          print("HF Prediction API deployed.")
          PY


# =========================================================
# STAGE 3B — DEPLOY STREAMLIT HF SPACE
# =========================================================

  deploy-ui:
    name: Deploy HF Streamlit UI
    needs:
      - model-training
      - deploy-api

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7


      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"


      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub


      - name: Configure API URL and Deploy UI
        env:
          HF_TOKEN_ML: ${{ secrets.HF_TOKEN_ML }}
          HF_UI_SPACE_REPO: ${{ secrets.HF_UI_SPACE_REPO }}
          HF_API_URL: ${{ secrets.HF_API_URL }}

        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(
              token=os.environ["HF_TOKEN_ML"]
          )

          ui_repo = os.environ["HF_UI_SPACE_REPO"]

          # Set API URL as HF Space environment variable
          api.add_space_variable(
              repo_id=ui_repo,
              key="PREDICTION_API_URL",
              value=os.environ["HF_API_URL"]
          )

          # Upload only HF UI deployment files
          api.upload_folder(
              folder_path="deployment/hf_ui",
              repo_id=ui_repo,
              repo_type="space"
          )

          print("HF Streamlit UI deployed.")
          PY
